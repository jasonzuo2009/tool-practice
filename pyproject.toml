[project]
name = "tool-practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jason", email = "jasonzuo2009@163.com" }
]
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2",
    "typer>=0.29.1",
]

[project.scripts]
tool-practice = "tool_practice:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
